    // moment you land back on page 1 even with panels still left to step
    // through backward.
    if (!guidedViewEnabled) {
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === pageUrls.length - 1;
    }

    pageIndicator.textContent = `${currentIndex + 1} / ${pageUrls.length}`;

    // Highlight the thumbnail that matches the page we just switched to,
    // and un-highlight every other one.
    const thumbs = sidebar.children;
    for (let i = 0; i < thumbs.length; i++) {
        thumbs[i].classList.toggle("active", i === currentIndex);
    }
    // If that thumbnail is scrolled out of view (a long comic's sidebar/
    // filmstrip), scroll it into view automatically.
    const activeThumb = thumbs[currentIndex];
    if (activeThumb) {
        activeThumb.scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    return loaded;
}

// Switches to a different page, fading through black around it when
// Guided View is on (since that's genuinely different content, not a
// same-page camera move — see the fade section's comment above) and
// skipping the fade entirely in normal mode (showPage() alone already
// looks fine there — it's just the plain page turn this app always had).
// Used by goPrev()/goNext()'s page-crossing branches and by clicking a
// thumbnail.
async function goToPage(index, options = {}) {
    if (!guidedViewEnabled) {
        showPage(index, options);
        return;
    }
    if (guidedTransitionInProgress) return;
    guidedTransitionInProgress = true;
    await fadeOut();
    await showPage(index, options);
    await fadeIn();
    guidedTransitionInProgress = false;
}

// One step backward: the previous detected panel if there is one on this
// page, otherwise the previous page (entering at its last detected
// panel, if Guided View is on). Shared by the ‹ button and the ← arrow
// key, and (via goNext's mirror image) consistent boundary behavior at
// the very first page/panel.
function goPrev() {
    if (guidedViewEnabled && currentPanelIndex > 0) {
        stepToPanel(currentPanelIndex - 1);
        return;
    }
    if (currentIndex > 0) {
        goToPage(currentIndex - 1, { enterFromEnd: guidedViewEnabled });
    }
}

// One step forward: the mirror image of goPrev() above.
function goNext() {
    if (guidedViewEnabled && currentPanelIndex < currentPanelList.length - 1) {
        stepToPanel(currentPanelIndex + 1);
        return;
    }
    if (currentIndex < pageUrls.length - 1) {
        goToPage(currentIndex + 1);
    }
}

// The ‹ › buttons at the bottom of the screen.
prevBtn.addEventListener("click", goPrev);
nextBtn.addEventListener("click", goNext);

// Lets you flip pages (or Guided View steps) with the keyboard's ← / →
// arrow keys, as an alternative to clicking the on-screen buttons.
document.addEventListener("keydown", (event) => {
    if (pageUrls.length === 0) return;
    if (event.key === "ArrowLeft") goPrev();
    else if (event.key === "ArrowRight") goNext();
});

// ----------------------------------------------------------------------
// READING THE ARCHIVE: turning a .cbz or .cbr file into a list of pages.
// The actual extraction logic (isImageFile, extractZipEntries,
// extractRarEntries, extractComicArchive) now lives in archive-extract.js,
// shared with editor.html.
// ----------------------------------------------------------------------

// ============================================================================
// STEP 3: THE MAIN EVENT — this runs every time you pick a file with the
// "Choose File" button. This is the heart of the app: it figures out
// whether you picked a zip-based or rar-based archive, extracts the pages,
// builds the thumbnail sidebar, and shows the first page. If ANYTHING goes
// wrong anywhere in this whole process, the catch block at the bottom
// catches it, shows you a popup with the error message, and writes it to
// the debug console too.
// ============================================================================
fileInput.addEventListener("change", async (event) => {

    const file = event.target.files[0];
    if (!file) return; // user opened the picker but didn't actually pick anything

    // Reset everything back to a clean "loading" state before we start,
    // in case a different comic was already open.
    revokeAllPageUrls();
    detectedPanelRowsByPage.clear(); // page index 0 of THIS file has nothing to do with whatever was cached for page index 0 of the last one
    sidebar.innerHTML = "";
    pageCanvas.hidden = true;
    pageNav.hidden = true;
    zoomControls.hidden = true;
    emptyState.hidden = false;
    emptyState.textContent = "Loading...";
    logText.textContent = "";
    logCollapsed = false; // always show the console fresh for a newly-opened file
    status.textContent = "Loading...";
    setGuidedView(false); // start every newly-opened file in normal (non-Guided) view

    try {

        writeLog("Opening: " + file.name);
        writeLog("File Size: " + file.size + " bytes");

        // Extracts the archive and sorts pages into natural reading order
        // (so "page2.jpg" sorts before "page10.jpg", not after it, the way
        // plain alphabetical sorting would get wrong) — see archive-extract.js.
        const { pages, acbfText } = await ArchiveExtract.extractComicArchive(file, writeLog);

        writeLog("\nImage count: " + pages.length);

        if (pages.length === 0) {
            throw new Error(
                "No supported image files found inside archive."
            );
        }

        // If this archive shipped an .acbf file, this is every page it has
        // panel data for, keyed by image filename — see parseAcbfFrames()
        // and the "GUIDED VIEW" section further down. Empty if there was
        // no .acbf file, or it didn't parse, or it named no pages: Guided
        // View just falls back to the model for every page in that case.
        const acbfFramesByName = acbfText ? PanelDetection.parseAcbfFrames(acbfText) : new Map();
        acbfStatus = { withData: 0, total: pages.length };

        // Build one thumbnail (+ its page-number label) per page, and
        // collect each page's displayable image address into pageUrls
        // along the way — this is also where each page actually gets
        // decompressed (via getBlob()), one at a time, in order.
        for (let i = 0; i < pages.length; i++) {

            const page = pages[i];
            writeLog("Loading image: " + page.name);

            const blob = await page.getBlob();
            // Turns the raw image data into a temporary address that can
            // be loaded and drawn onto the page canvas, and used directly
            // as a thumbnail <img src="..."> — see the "MEMORY CLEANUP"
            // comment above for why these later need to be explicitly
            // released.
            const url = URL.createObjectURL(blob);
            pageUrls.push(url);

            // Seed this page's Guided View panels straight from the .acbf
            // data if it named this image — one frame per row, since
            // ACBF's own order is ground truth and must never be
            // re-sorted or manga-reversed (see flattenPanelRows()).
            // detectPanelsForPage() sees this page is already in the
            // cache and never touches the model for it at all.
            const acbfFrames = acbfFramesByName.get(page.name.split(/[\\/]/).pop().toLowerCase());
            if (acbfFrames) {
                detectedPanelRowsByPage.set(i, acbfFrames.map(frame => [frame]));
                acbfStatus.withData++;
            }

            const thumbItem = document.createElement("div");
            thumbItem.className = "thumb-item";
            thumbItem.addEventListener("click", () => goToPage(i));

            const thumbImg = document.createElement("img");
            thumbImg.className = "thumb";
            thumbImg.loading = "lazy";
            thumbImg.src = url;
            thumbImg.alt = page.name;
            thumbImg.onerror = () => {
                console.error("Failed thumbnail:", page.name);
            };

            const thumbLabel = document.createElement("span");
            thumbLabel.className = "thumb-label";
            thumbLabel.textContent = i + 1;

            thumbItem.appendChild(thumbImg);
            thumbItem.appendChild(thumbLabel);
            sidebar.appendChild(thumbItem);
        }

        // Everything's ready — swap the placeholder text out for the
        // actual reader UI, starting on page 1.
        emptyState.hidden = true;
        pageCanvas.hidden = false;
        pageNav.hidden = false;
        zoomControls.hidden = false;
        resetZoom(); // start each newly-opened file at the normal 100% size
        showPage(0);

        status.textContent = `${pages.length} pages loaded`;

    } catch (error) {

        // Something above went wrong (bad file, unsupported format,
        // corrupted archive, etc.) — show it to the user two ways: a
        // popup alert, and a line in the on-page debug console — plus
        // print the full error object to DevTools for deeper digging.
        console.error(error);

        status.textContent = "Failed";
        emptyState.hidden = false;
        emptyState.textContent = "Failed to load comic.";
        pageCanvas.hidden = true;
        pageNav.hidden = true;
        zoomControls.hidden = true;

        alert(
            "Comic Load Error:\n\n" +
            error.message +
            "\n\nPress F12 and check Console."
        );

        writeLog("\nERROR:");
        writeLog(error.message);

    }
});

// ============================================================================
// STEP 4: register the service worker (sw.js), which is what lets this app
// keep working offline / be "installed" after the first visit. This has
// nothing to do with reading comics — it's purely the PWA/offline plumbing.
// If this fails, the reader itself still works completely normally; you
// just won't get offline support. (It will always fail if you're opening
// this file directly, e.g. by double-clicking it — service workers require
// the page to be loaded via http:// or https://, not file://.)
// ============================================================================
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("sw.js")
            .catch(err => console.error("SW registration failed:", err));
    });
}
</script>

</body>
</html>
