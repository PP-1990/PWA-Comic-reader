<!DOCTYPE html>
<html lang="en">
<head>
<!--
============================================================================
 WHAT IS THIS PAGE?
============================================================================
 The ACBF Panel Editor: a tool for a publisher to open a .cbz/.cbr archive
 and produce an ACBF (Advanced Comic Book Format) metadata file describing
 where each page's panels are, in reading order. That .acbf file is what
 lets the reader (index.html)'s Guided View show exact, hand-verified panel
 boundaries instead of guessing with the on-device ML model.

 Nothing here is uploaded anywhere — the archive you open, and the ACBF
 file this produces, only ever exist in this browser tab and whatever you
 explicitly save to your own device.

 HOW IT WORKS:
   1. Open a comic archive, same as the reader.
   2. Each page gets a starting draft of panel boxes automatically — either
      from an .acbf file already inside the archive (if it has one), or
      from the same on-device panel-detection model the reader uses (see
      panel-detection.js). Either way, that's a DRAFT: check it, don't
      assume it's right.
   3. Drag/resize boxes to correct them, use "+ Add Panel" for anything the
      draft missed entirely, delete boxes that shouldn't be there, and
      reorder the panel list on the right to fix reading order (the panel
      LIST order is what gets written out as ACBF's reading order).
   4. Export either a standalone .acbf file, or a full repackaged .cbz with
      that .acbf bundled inside it, ready to open in the reader.

 SHARED CODE: this page loads the exact same panel-detection.js and
 archive-extract.js modules as index.html (the reader), so the automatic
 draft and the archive-reading logic can never drift out of sync between
 the two pages — see those two files' own header comments.
============================================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACBF Panel Editor</title>
<link rel="icon" href="icons/icon-192.png">

<script src="jszip.min.js"></script>
<script src="unrar/unrar-bundle.js"></script>
<script src="onnx/ort.min.js"></script>
<script src="panel-detection.js"></script>
<script src="archive-extract.js"></script>

<style>

</style>
</head>
<body>

<div id="topbar">
    <h1>ACBF Panel Editor</h1>
    <input type="file" id="fileInput" accept=".cbz,.cbr,.zip,.rar">
    <span class="status" id="status"></span>
    <label>Title
        <input type="text" id="bookTitleInput" placeholder="Book title">
    </label>
    <label id="mangaModeRow">
        <input type="checkbox" id="mangaModeCheckbox">
        Manga mode (right-to-left) — affects new auto-detection only
    </label>
    <a href="index.html">&larr; Back to Reader</a>
</div>

<div id="log">
    <div id="logHeader"><button id="logCloseBtn">&times;</button></div>
    <div id="logText"></div>
</div>

<div id="main">
    <div id="thumbSidebar" hidden></div>

    <div id="canvasArea">
        <div id="emptyState">Open a .cbz or .cbr archive to start authoring its ACBF panel metadata.</div>
        <div id="pageNav" hidden>
            <button class="secondary small" id="prevPageBtn">&#8249; Prev</button>
            <span id="pageIndicator">1 / 1</span>
            <button class="secondary small" id="nextPageBtn">Next &#8250;</button>
        </div>
        <div id="canvasScroll" hidden>
            <div id="canvasWrap">
                <canvas id="editorCanvas"></canvas>
                <div id="overlayContainer"></div>
            </div>
        </div>
    </div>

    <div id="panelSidebar" hidden>
        <h2 id="panelListHeader">Panels</h2>
        <ol id="panelList"></ol>
        <div id="sidebarActions">
            <button id="addPanelBtn">+ Add Panel</button>
            <button class="secondary" id="detectBtn">Detect Automatically</button>
        </div>
    </div>
</div>

<div id="exportBar" hidden>
    <button id="exportAcbfBtn">Export .acbf</button>
    <button id="exportCbzBtn">Export CBZ + ACBF</button>
</div>

<script>
// ============================================================================
// STATE
// ============================================================================
let pages = [];              // [{ name, getBlob, rects, naturalWidth, naturalHeight, blobUrl }]
let acbfFramesByName = new Map();
let currentPageIndex = 0;
let currentImage = null;     // the decoded <img> for the page currently drawn
let mangaMode = false;
let selectedPanelIndex = -1;
let dragState = null;

const fileInput = document.getElementById("fileInput");
const status = document.getElementById("status");
const bookTitleInput = document.getElementById("bookTitleInput");
const mangaModeCheckbox = document.getElementById("mangaModeCheckbox");
const log = document.getElementById("log");
const logText = document.getElementById("logText");
const logCloseBtn = document.getElementById("logCloseBtn");
const thumbSidebar = document.getElementById("thumbSidebar");
const emptyState = document.getElementById("emptyState");
const pageNav = document.getElementById("pageNav");
const pageIndicator = document.getElementById("pageIndicator");
const prevPageBtn = document.getElementById("prevPageBtn");
const nextPageBtn = document.getElementById("nextPageBtn");
const canvasScroll = document.getElementById("canvasScroll");
const canvasWrap = document.getElementById("canvasWrap");
const editorCanvas = document.getElementById("editorCanvas");
const overlayContainer = document.getElementById("overlayContainer");
const panelSidebar = document.getElementById("panelSidebar");
const panelListHeader = document.getElementById("panelListHeader");
const panelList = document.getElementById("panelList");
const addPanelBtn = document.getElementById("addPanelBtn");
const detectBtn = document.getElementById("detectBtn");
const exportBar = document.getElementById("exportBar");
const exportAcbfBtn = document.getElementById("exportAcbfBtn");
const exportCbzBtn = document.getElementById("exportCbzBtn");

let logCollapsed = false;
function writeLog(text) {
    if (!logCollapsed) log.style.display = "block";
    logText.textContent += text + "\n";
    console.log(text);
}
logCloseBtn.addEventListener("click", () => {
    logCollapsed = true;
    log.style.display = "none";
});

mangaModeCheckbox.addEventListener("change", () => {
    mangaMode = mangaModeCheckbox.checked;
});

// ============================================================================
// OPENING A FILE
// ============================================================================
fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;

    logText.textContent = "";
    logCollapsed = false;
    status.textContent = "Loading...";

    try {
        writeLog("Opening: " + file.name);
        writeLog("File Size: " + file.size + " bytes");

        const { pages: extractedPages, acbfText } = await ArchiveExtract.extractComicArchive(file, writeLog);
        writeLog("\nImage count: " + extractedPages.length);

        if (extractedPages.length === 0) {
            throw new Error("No supported image files found inside archive.");
        }

        acbfFramesByName = acbfText ? PanelDetection.parseAcbfFrames(acbfText) : new Map();
        if (acbfText) {
            writeLog(acbfFramesByName.size > 0
                ? "Found an existing .acbf with panel data for " + acbfFramesByName.size + " page(s) — using it as the starting draft for those."
                : "Found an .acbf file but couldn't read panel data from it — starting from automatic detection instead.");
        }

        pages = extractedPages.map(p => ({
            name: p.name,
            getBlob: p.getBlob,
            rects: null,          // null = not yet drafted; filled in on first visit
            naturalWidth: 0,
            naturalHeight: 0,
            blobUrl: null
        }));

        const titleGuess = file.name.replace(/\.(cbz|cbr|zip|rar)$/i, "");
        bookTitleInput.value = titleGuess;

        status.textContent = pages.length + " page(s) loaded";
        emptyState.hidden = true;
        pageNav.hidden = false;
        canvasScroll.hidden = false;
        panelSidebar.hidden = false;
        exportBar.hidden = false;
        thumbSidebar.hidden = false;

        await buildThumbnails();
        await showPage(0);

    } catch (err) {
        writeLog("ERROR: " + err.message);
        status.textContent = "Failed to open file.";
        alert("Couldn't open that file:\n\n" + err.message);
    }
});

function baseName(name) {
    return name.split(/[\\/]/).pop().toLowerCase();
}

async function buildThumbnails() {
    thumbSidebar.innerHTML = "";
    for (let i = 0; i < pages.length; i++) {
        const page = pages[i];
        const blob = await page.getBlob();
        const url = URL.createObjectURL(blob);
        const div = document.createElement("div");
        div.className = "thumb";
        div.dataset.index = String(i);
        const img = document.createElement("img");
        img.src = url;
        const num = document.createElement("div");
        num.className = "num";
        num.textContent = String(i + 1);
        div.appendChild(img);
        div.appendChild(num);
        div.addEventListener("click", () => showPage(i));
        thumbSidebar.appendChild(div);
    }
    refreshThumbActiveState();
}

function refreshThumbActiveState() {
    thumbSidebar.querySelectorAll(".thumb").forEach(div => {
        const i = Number(div.dataset.index);
        div.classList.toggle("active", i === currentPageIndex);
        div.classList.toggle("has-panels", !!(pages[i].rects && pages[i].rects.length > 0));
    });
}

// ============================================================================
// SHOWING A PAGE
// ============================================================================
function flattenPanelRows(rows) {
    const result = [];
    for (const row of rows) result.push(...(mangaMode ? row.slice().reverse() : row));
    return result;
}

async function loadPageImage(page) {
    const blob = await page.getBlob();
    const url = URL.createObjectURL(blob);
    const img = new Image();
    await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error("Failed to decode image: " + page.name));
        img.src = url;
    });
    page.blobUrl = url;
    page.naturalWidth = img.naturalWidth;
    page.naturalHeight = img.naturalHeight;
    return img;
}

async function draftPanelsIfNeeded(page) {
    if (page.rects !== null) return;

    const acbfRects = acbfFramesByName.get(baseName(page.name));
    if (acbfRects && acbfRects.length > 0) {
        page.rects = acbfRects.map(r => ({ ...r }));
        return;
    }

    try {
        const rows = await PanelDetection.detectPanels(editorCanvas);
        page.rects = flattenPanelRows(rows).map(r => ({ ...r }));
    } catch (err) {
        writeLog("Automatic detection failed (" + err.message + ") — starting with a blank page instead.");
        page.rects = [];
    }
}

async function showPage(index) {
    currentPageIndex = Math.max(0, Math.min(index, pages.length - 1));
    const page = pages[currentPageIndex];

    selectedPanelIndex = -1;
    pageIndicator.textContent = (currentPageIndex + 1) + " / " + pages.length;
    prevPageBtn.disabled = currentPageIndex === 0;
    nextPageBtn.disabled = currentPageIndex === pages.length - 1;

    status.textContent = "Loading page " + (currentPageIndex + 1) + "...";
    currentImage = await loadPageImage(page);

    editorCanvas.width = page.naturalWidth;
    editorCanvas.height = page.naturalHeight;
    editorCanvas.getContext("2d").drawImage(currentImage, 0, 0);

    if (page.rects === null) {
        status.textContent = "Detecting panels...";
        await draftPanelsIfNeeded(page);
    }

    status.textContent = pages.length + " page(s) loaded";
    renderOverlay();
    renderPanelList();
    refreshThumbActiveState();
}

prevPageBtn.addEventListener("click", () => showPage(currentPageIndex - 1));
nextPageBtn.addEventListener("click", () => showPage(currentPageIndex + 1));

// ============================================================================
// OVERLAY RENDERING + DRAG/RESIZE EDITING
// Boxes are positioned with percentages relative to #canvasWrap, which is
// sized exactly to the canvas's own rendered box (a plain block-level
// child) — so the overlay always lines up with the image regardless of
// how big the canvas is drawn on screen, with no manual resize handling.
// ============================================================================
function renderOverlay() {
    overlayContainer.innerHTML = "";
    const page = pages[currentPageIndex];
    (page.rects || []).forEach((rect, i) => {
        const box = document.createElement("div");
        box.className = "panel-box" + (i === selectedPanelIndex ? " selected" : "");
        box.style.left = (rect.x / page.naturalWidth * 100) + "%";
        box.style.top = (rect.y / page.naturalHeight * 100) + "%";
        box.style.width = (rect.width / page.naturalWidth * 100) + "%";
        box.style.height = (rect.height / page.naturalHeight * 100) + "%";

        const numLabel = document.createElement("div");
        numLabel.className = "panel-num";
        numLabel.textContent = String(i + 1);
        box.appendChild(numLabel);

        const handle = document.createElement("div");
        handle.className = "resize-handle";
        box.appendChild(handle);

        box.addEventListener("pointerdown", (e) => {
            selectedPanelIndex = i;
            renderOverlay();
            renderPanelList();
            startDrag(e, i, "move");
        });
        handle.addEventListener("pointerdown", (e) => {
            e.stopPropagation();
            selectedPanelIndex = i;
            renderOverlay();
            renderPanelList();
            startDrag(e, i, "resize");
        });

        overlayContainer.appendChild(box);
    });
}

function startDrag(e, index, type) {
    e.preventDefault();
    const page = pages[currentPageIndex];
    const containerRect = canvasWrap.getBoundingClientRect();
    dragState = {
        type,
        index,
        startClientX: e.clientX,
        startClientY: e.clientY,
        startRect: { ...page.rects[index] },
        scaleX: page.naturalWidth / containerRect.width,
        scaleY: page.naturalHeight / containerRect.height
    };
    document.addEventListener("pointermove", onDragMove);
    document.addEventListener("pointerup", onDragEnd);
}

function onDragMove(e) {
    if (!dragState) return;
    const page = pages[currentPageIndex];
    const rect = page.rects[dragState.index];
    const dx = (e.clientX - dragState.startClientX) * dragState.scaleX;
    const dy = (e.clientY - dragState.startClientY) * dragState.scaleY;
    const MIN_SIZE = 10;

    if (dragState.type === "move") {
        rect.x = Math.max(0, Math.min(page.naturalWidth - rect.width, dragState.startRect.x + dx));
        rect.y = Math.max(0, Math.min(page.naturalHeight - rect.height, dragState.startRect.y + dy));
    } else {
        rect.width = Math.max(MIN_SIZE, Math.min(page.naturalWidth - rect.x, dragState.startRect.width + dx));
        rect.height = Math.max(MIN_SIZE, Math.min(page.naturalHeight - rect.y, dragState.startRect.height + dy));
    }
    renderOverlay();
}

function onDragEnd() {
    dragState = null;
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", onDragEnd);
    refreshThumbActiveState();
}

// ============================================================================
// PANEL LIST SIDEBAR
// ============================================================================
function renderPanelList() {
    const page = pages[currentPageIndex];
    const rects = page.rects || [];
    panelListHeader.textContent = "Panels (" + rects.length + ")";
    panelList.innerHTML = "";

    rects.forEach((rect, i) => {
        const li = document.createElement("li");
        li.className = i === selectedPanelIndex ? "selected" : "";

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Panel " + (i + 1);
        li.addEventListener("click", () => {
            selectedPanelIndex = i;
            renderOverlay();
            renderPanelList();
        });

        const btns = document.createElement("span");
        btns.className = "btns";

        const upBtn = document.createElement("button");
        upBtn.className = "small secondary";
        upBtn.textContent = "↑";
        upBtn.title = "Move earlier in reading order";
        upBtn.disabled = i === 0;
        upBtn.addEventListener("click", (e) => { e.stopPropagation(); movePanel(i, -1); });

        const downBtn = document.createElement("button");
        downBtn.className = "small secondary";
        downBtn.textContent = "↓";
        downBtn.title = "Move later in reading order";
        downBtn.disabled = i === rects.length - 1;
        downBtn.addEventListener("click", (e) => { e.stopPropagation(); movePanel(i, 1); });

        const delBtn = document.createElement("button");
        delBtn.className = "small secondary";
        delBtn.textContent = "✕";
        delBtn.title = "Delete panel";
        delBtn.addEventListener("click", (e) => { e.stopPropagation(); deletePanel(i); });

        btns.appendChild(upBtn);
        btns.appendChild(downBtn);
        btns.appendChild(delBtn);
        li.appendChild(label);
        li.appendChild(btns);
        panelList.appendChild(li);
    });
}

function movePanel(index, direction) {
    const rects = pages[currentPageIndex].rects;
    const target = index + direction;
    if (target < 0 || target >= rects.length) return;
    [rects[index], rects[target]] = [rects[target], rects[index]];
    selectedPanelIndex = target;
    renderOverlay();
    renderPanelList();
}

function deletePanel(index) {
    const rects = pages[currentPageIndex].rects;
    rects.splice(index, 1);
    selectedPanelIndex = -1;
    renderOverlay();
    renderPanelList();
    refreshThumbActiveState();
}

addPanelBtn.addEventListener("click", () => {
    const page = pages[currentPageIndex];
    if (!page.rects) page.rects = [];
    const w = page.naturalWidth * 0.4;
    const h = page.naturalHeight * 0.3;
    page.rects.push({
        x: (page.naturalWidth - w) / 2,
        y: (page.naturalHeight - h) / 2,
        width: w,
        height: h
    });
    selectedPanelIndex = page.rects.length - 1;
    renderOverlay();
    renderPanelList();
    refreshThumbActiveState();
});

detectBtn.addEventListener("click", async () => {
    const page = pages[currentPageIndex];
    if (page.rects && page.rects.length > 0) {
        const proceed = confirm("This replaces the " + page.rects.length + " panel(s) already on this page with a fresh automatic detection. Continue?");
        if (!proceed) return;
    }
    status.textContent = "Detecting panels...";
    try {
        const rows = await PanelDetection.detectPanels(editorCanvas);
        page.rects = flattenPanelRows(rows).map(r => ({ ...r }));
    } catch (err) {
        writeLog("Automatic detection failed: " + err.message);
        alert("Automatic detection failed:\n\n" + err.message);
    }
    status.textContent = pages.length + " page(s) loaded";
    selectedPanelIndex = -1;
    renderOverlay();
    renderPanelList();
    refreshThumbActiveState();
});

// ============================================================================
// EXPORT
// ============================================================================
function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function buildAcbfPagesData() {
    return pages.map(p => ({ imageName: p.name, rects: p.rects || [] }));
}

exportAcbfBtn.addEventListener("click", () => {
    const xml = PanelDetection.buildAcbfXml(buildAcbfPagesData(), bookTitleInput.value || "Untitled");
    const blob = new Blob([xml], { type: "application/xml" });
    downloadBlob(blob, (bookTitleInput.value || "comic") + ".acbf");
});

exportCbzBtn.addEventListener("click", async () => {
    status.textContent = "Building CBZ...";
    try {
        const zip = new JSZip();
        for (const page of pages) {
            const blob = await page.getBlob();
            zip.file(page.name, blob);
        }
        const xml = PanelDetection.buildAcbfXml(buildAcbfPagesData(), bookTitleInput.value || "Untitled");
        zip.file((bookTitleInput.value || "comic") + ".acbf", xml);
        const cbzBlob = await zip.generateAsync({ type: "blob" });
        downloadBlob(cbzBlob, (bookTitleInput.value || "comic") + ".cbz");
    } catch (err) {
        writeLog("Failed to build CBZ: " + err.message);
        alert("Failed to build CBZ:\n\n" + err.message);
    }
    status.textContent = pages.length + " page(s) loaded";
});
</script>
